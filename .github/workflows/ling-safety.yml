name: Ling Safety Regression

on:
  pull_request:
    paths:
      - "src/components/LingPanel.tsx"
      - "src/components/LingDoctorBriefPreview.tsx"
      - "src/data/healthConcerns*.ts"
      - "src/data/lingHealthTaxonomy*.ts"
      - "src/data/lingSafetyTestCases.ts"
      - "src/data/lingSafetyAdversarialCases.ts"
      - "src/data/treatmentEducation*.ts"
      - "src/lib/lingAssessmentPlan.ts"
      - "src/lib/lingDoctorBrief.ts"
      - "src/lib/lingClarification.ts"
      - "src/lib/lingHealthRouter.ts"
      - "src/lib/lingTreatmentRouter.ts"
      - "src/lib/lingUrgency.ts"
      - "scripts/run-ling-safety-tests.ts"
      - "scripts/run-ling-treatment-tests.ts"
      - "scripts/run-ling-assessment-tests.ts"
      - "scripts/run-ling-doctor-brief-tests.ts"
      - ".github/workflows/ling-safety.yml"
  push:
    branches:
      - visual-refresh-phase2
    paths:
      - "src/components/LingPanel.tsx"
      - "src/components/LingDoctorBriefPreview.tsx"
      - "src/data/healthConcerns*.ts"
      - "src/data/lingHealthTaxonomy*.ts"
      - "src/data/lingSafetyTestCases.ts"
      - "src/data/lingSafetyAdversarialCases.ts"
      - "src/data/treatmentEducation*.ts"
      - "src/lib/lingAssessmentPlan.ts"
      - "src/lib/lingDoctorBrief.ts"
      - "src/lib/lingClarification.ts"
      - "src/lib/lingHealthRouter.ts"
      - "src/lib/lingTreatmentRouter.ts"
      - "src/lib/lingUrgency.ts"
      - "scripts/run-ling-safety-tests.ts"
      - "scripts/run-ling-treatment-tests.ts"
      - "scripts/run-ling-assessment-tests.ts"
      - "scripts/run-ling-doctor-brief-tests.ts"
      - ".github/workflows/ling-safety.yml"

jobs:
  ling-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Ling safety regression
        run: npx --yes tsx@4.20.6 scripts/run-ling-safety-tests.ts

      - name: Run Ling treatment-routing regression
        run: npx --yes tsx@4.20.6 scripts/run-ling-treatment-tests.ts

      - name: Run Ling assessment-plan regression
        run: npx --yes tsx@4.20.6 scripts/run-ling-assessment-tests.ts

      - name: Run Ling doctor-brief regression
        run: npx --yes tsx@4.20.6 scripts/run-ling-doctor-brief-tests.ts
