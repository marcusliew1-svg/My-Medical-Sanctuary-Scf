name: T6.20 lockfile refresh

on:
  push:
    branches:
      - mms/t6-20-dependency-security-hardening
    paths:
      - package.json
      - .github/workflows/t6-20-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mms/t6-20-dependency-security-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile from pinned package manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "T6.20 refresh dependency lockfile"
          git push origin HEAD:mms/t6-20-dependency-security-hardening
