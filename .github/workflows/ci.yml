name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security audit
        run: npm run security:prod

      - name: Dev/build dependency security baseline
        run: npm run security:dev-baseline

      - name: Operator security tests
        run: npm run test:operator-security

      - name: Next major upgrade tests
        run: npm run test:next-major

      - name: Operations Console integration tests
        run: npm run test:operations-console

      - name: Commission Control Centre integration tests
        run: npm run test:commission-centre

      - name: Multilingual integration tests
        run: npm run test:multilingual

      - name: Enquiry hardening tests
        run: npm run test:enquiry-hardening
      - name: Partner Auth tests
        run: npm run test:partner-auth

      - name: Public design foundation tests
        run: npm run test:design-foundation

      - name: T4 public redesign tests
        run: npm run test:t4

      - name: T5 production readiness tests
        run: npm run test:t5

      - name: T6 P0 blocker closure tests
        run: npm run test:t6

      - name: T6.3 partner and patient access tests
        run: npm run test:t6-3

      - name: T6.18 operational closure tests
        run: npm run test:t6-18

      - name: T6.19 governance review workflow tests
        run: npm run test:t6-19

      - name: T6.20 dependency security hardening tests
        run: npm run test:t6-20

      - name: T6.21 dev toolchain hardening tests
        run: npm run test:t6-21

      - name: T6.22 operational resilience tests
        run: npm run test:t6-22

      - name: T6.23 incident reliability tests
        run: npm run test:t6-23

      - name: T6.24 backup recovery continuity tests
        run: npm run test:t6-24

      - name: T6.25 data retention privacy lifecycle tests
        run: npm run test:t6-25

      - name: T6.26 access governance and segregation tests
        run: npm run test:t6-26

      - name: T6.27 change release governance tests
        run: npm run test:t6-27

      - name: T6.28 third-party vendor risk tests
        run: npm run test:t6-28

      - name: T6.29 audit control assurance tests
        run: npm run test:t6-29

      - name: T6.30 training competency attestation tests
        run: npm run test:t6-30

      - name: T6.31 complaints speak-up governance tests
        run: npm run test:t6-31

      - name: T6.32 regulatory obligations governance tests
        run: npm run test:t6-32

      - name: T6.33 management review assurance tests
        run: npm run test:t6-33

      - name: T6.34 policy exception risk acceptance tests
        run: npm run test:t6-34

      - name: T6.35 evidence integrity lineage tests
        run: npm run test:t6-35

      - name: T6.36 metrics control performance tests
        run: npm run test:t6-36

      - name: T6.37 data quality reconciliation tests
        run: npm run test:t6-37

      - name: T6.38 AI model governance tests
        run: npm run test:t6-38

      - name: T6.39 CAPA effectiveness tests
        run: npm run test:t6-39

      - name: T6.40 privacy rights request tests
        run: npm run test:t6-40

      - name: T6.41 consent authorization withdrawal tests
        run: npm run test:t6-41

      - name: T6.42 privacy security assessment tests
        run: npm run test:t6-42

      - name: T6.44 Presentation Centre lifecycle tests
        run: npm run test:t6-44

      - name: T6.47 cross-workflow assurance tests
        run: npm run test:t6-47

      - name: T6.49 Preview Auth Admin provisioning guards
        run: npm run test:t6-49

      - name: T6.52 private owner role regression checks
        run: npm run test:t6-52

      - name: T6.53 Owner portal privacy and access tests
        run: npm run test:t6-53

      - name: T6.54 MMS staff onboarding tests
        run: npm run test:t6-54

      - name: T6.55 staging API exposure audit
        run: npm run test:t6-55

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
