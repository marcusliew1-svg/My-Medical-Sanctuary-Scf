name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Operator security tests
        run: npm run test:operator-security

      - name: Next major upgrade tests
        run: npm run test:next-major

      - name: Operations Console integration tests
        run: npm run test:operations-console

      - name: Commission Control Centre integration tests
        run: npm run test:commission-centre

      - name: Multilingual integration tests
        run: npm run test:multilingual

      - name: Enquiry hardening tests
        run: npm run test:enquiry-hardening

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
