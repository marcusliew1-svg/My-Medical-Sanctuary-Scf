name: pg lock preview

on:
  push:
    branches:
      - commerce-recruitment-foundation

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate lockfile preview
        run: |
          npm install --save-exact pg@8.22.0 --package-lock-only
          echo 'PACKAGE_JSON_B64_BEGIN'
          base64 -w0 package.json
          echo
          echo 'PACKAGE_JSON_B64_END'
          echo 'PACKAGE_LOCK_B64_BEGIN'
          base64 -w0 package-lock.json
          echo
          echo 'PACKAGE_LOCK_B64_END'
