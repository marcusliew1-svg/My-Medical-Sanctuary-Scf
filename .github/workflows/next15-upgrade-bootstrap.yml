name: Next 15 Security Upgrade Bootstrap

on:
  push:
    branches:
      - next15-security-upgrade
    paths:
      - ".github/workflows/next15-upgrade-bootstrap.yml"
      - "package.json"
      - "src/app/health-concerns/[slug]/page.tsx"
      - "src/app/treatments/[slug]/page.tsx"

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: next15-security-upgrade

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade framework dependencies
        run: |
          npm install --save-exact next@15.5.21 react@19 react-dom@19
          npm install --save-dev --save-exact eslint-config-next@15.5.21 @types/react@19 @types/react-dom@19

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit verified dependency lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already match the verified upgrade."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Next.js security baseline to 15.5.21"
          git push origin HEAD:next15-security-upgrade
