name: Refresh UX Trust Branch

on:
  push:
    branches:
      - ux-trust-membership-refresh

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refresh branch
        uses: actions/checkout@v4
        with:
          ref: ux-trust-membership-refresh
          fetch-depth: 0

      - name: Merge legacy UX branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ux-trust-membership-batch
          git merge --no-edit origin/ux-trust-membership-batch
          git push origin HEAD:ux-trust-membership-refresh
