name: T6.21 lockfile refresh

on:
  pull_request:
    branches:
      - mms/integration-next16-foundation
    paths:
      - package.json
      - .github/workflows/t6-21-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mms/t6-21-dev-toolchain-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh T6.21 lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "T6.21 refresh dependency lockfile"
          git push origin HEAD:mms/t6-21-dev-toolchain-hardening
