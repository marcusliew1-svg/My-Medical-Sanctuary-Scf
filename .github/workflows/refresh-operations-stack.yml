name: Refresh Operations Stack

on:
  push:
    branches:
      - operations-console-foundation

permissions:
  contents: write

jobs:
  refresh-base:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operations branch
        uses: actions/checkout@v4
        with:
          ref: operations-console-foundation
          fetch-depth: 0

      - name: Merge latest operator security foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin operator-security-foundation
          git merge --no-edit origin/operator-security-foundation
          git push origin HEAD:operations-console-foundation
