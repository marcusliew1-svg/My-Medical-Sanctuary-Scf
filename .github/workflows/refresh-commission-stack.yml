name: Refresh Commission Stack

on:
  push:
    branches:
      - commission-control-centre

permissions:
  contents: write

jobs:
  refresh-base:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commission branch
        uses: actions/checkout@v4
        with:
          ref: commission-control-centre
          fetch-depth: 0

      - name: Merge latest operations console foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin operations-console-foundation
          git merge --no-edit origin/operations-console-foundation
          git push origin HEAD:commission-control-centre
